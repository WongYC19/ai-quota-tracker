<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quota Tracker</title>
    <meta name="description" content="Real-time AI quota monitoring across multiple providers and accounts.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: '#090d16',
                        panel: '#111726',
                        border: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #e2e8f0; }

        .glass { background: rgba(17,23,38,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(30,41,59,0.8); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        .bar-glow { box-shadow: 0 0 8px currentColor; }

        .provider-tab { transition: all 0.15s ease; }
        .provider-tab.active {
            background: rgba(99,102,241,0.15);
            border-left: 2px solid #6366f1;
            color: #a5b4fc;
        }
        .provider-tab:not(.active):hover {
            background: rgba(255,255,255,0.04);
        }

        .interval-btn { transition: all 0.12s ease; }
        .interval-btn.active {
            background: rgba(99,102,241,0.2);
            color: #a5b4fc;
            border-color: rgba(99,102,241,0.4);
        }

        @keyframes pulse-ring {
            0%  { transform: scale(0.8); opacity: 1; }
            100%{ transform: scale(2);   opacity: 0; }
        }
        .live-dot::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-ring 1.5s ease-out infinite;
        }
    </style>
</head>

<body class="min-h-screen flex overflow-hidden" style="height:100vh;">

    <!-- ── Sidebar ───────────────────────────────────────────────── -->
    <aside id="sidebar" class="w-60 flex flex-col shrink-0 border-r border-border" style="background:#0c1120;">
        <!-- Logo -->
        <div class="px-5 pt-6 pb-4 border-b border-border">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="ph ph-planet text-white text-lg"></i>
                </div>
                <div>
                    <h2 class="text-xs font-bold tracking-widest text-white uppercase">AI Tracker</h2>
                    <p class="text-[10px] text-indigo-400 font-mono tracking-wide">QUOTA MONITOR</p>
                </div>
            </div>
        </div>

        <!-- Provider tabs -->
        <div class="px-3 pt-4 pb-2">
            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-500 px-2 mb-2">Providers</p>
            <nav id="provider-nav" class="space-y-0.5">
                <!-- Populated by JS -->
            </nav>
        </div>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Status block -->
        <div class="p-4 mx-3 mb-4 rounded-xl glass">
            <div class="flex items-center space-x-2 mb-2">
                <span class="relative w-2 h-2 live-dot" style="display:inline-block; border-radius:50%; background:#10b981;"></span>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide ml-2">Orchestrator</span>
            </div>
            <p class="text-[11px] text-slate-500 font-mono">Scanner: <span class="text-emerald-400 font-semibold">ACTIVE</span></p>
            <p class="text-[11px] text-slate-500 font-mono">Listener: <span class="text-indigo-400 font-semibold">PORT 5000</span></p>
            <p class="text-[11px] text-slate-500 font-mono mt-0.5" id="sidebar-last-refresh">Last: —</p>
        </div>
    </aside>

    <!-- ── Main area ─────────────────────────────────────────────── -->
    <div class="flex flex-col flex-1 overflow-hidden">

        <!-- Top bar -->
        <header class="flex items-center justify-between px-7 py-3 border-b border-border shrink-0" style="background:#0c1120;">
            <!-- Title + provider breadcrumb -->
            <div>
                <h1 class="text-base font-bold text-white tracking-tight" id="header-title">Quota Dashboard</h1>
                <p class="text-xs text-slate-500 mt-0.5" id="header-sub">Multi-provider AI quota monitoring</p>
            </div>

            <!-- Controls cluster -->
            <div class="flex items-center space-x-3">
                <!-- Timezone selector -->
                <div class="flex items-center space-x-1.5 text-slate-400 glass px-3 py-1.5 rounded-lg">
                    <i class="ph ph-globe text-indigo-400 text-sm"></i>
                    <select id="timezone-select"
                        class="bg-transparent border-none text-slate-300 text-xs focus:ring-0 cursor-pointer outline-none [&>option]:bg-slate-900 [&>option]:text-slate-300">
                    </select>
                </div>

                <!-- Clock -->
                <div id="clock" class="text-slate-300 font-mono text-xs glass px-3 py-1.5 rounded-lg border border-border">--:--:--</div>

                <!-- Refresh interval -->
                <div class="flex items-center space-x-1 glass px-2 py-1.5 rounded-lg border border-border">
                    <i class="ph ph-clock text-indigo-400 text-sm mr-1"></i>
                    <div id="interval-btns" class="flex items-center space-x-0.5">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Manual sync -->
                <button id="sync-btn" onclick="manualSync()"
                    class="flex items-center space-x-1.5 glass border border-border hover:border-indigo-500/50 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                    <i class="ph ph-arrows-clockwise text-indigo-400" id="sync-icon"></i>
                    <span>Sync</span>
                </button>

                <!-- Add profile: hidden for Codex since it uses a global single account -->
                <button id="launch-btn" onclick="launchProfile()"
                    class="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition shadow-lg shadow-indigo-600/20"
                    style="display:none">
                    <i class="ph ph-plus-circle text-base"></i>
                    <span>Add Profile</span>
                </button>
            </div>
        </header>

        <!-- Scrollable content -->
        <main class="flex-1 overflow-y-auto px-7 py-6 space-y-6">

            <!-- KPI row -->
            <section class="grid grid-cols-4 gap-4" id="kpi-cards"></section>

            <!-- Two-column layout: accounts + side panels -->
            <div class="grid grid-cols-3 gap-6">
                <!-- Account list -->
                <section class="col-span-2 space-y-3" id="accounts-container"></section>

                <!-- Side panels -->
                <aside class="space-y-5">
                    <!-- 24 h trend -->
                    <div class="glass rounded-xl p-5">
                        <h3 class="text-xs font-bold text-white mb-4 flex items-center">
                            <i class="ph ph-trend-up mr-2 text-emerald-400"></i> Capacity (24 h)
                        </h3>
                        <div class="h-44"><canvas id="trendChart"></canvas></div>
                    </div>

                    <!-- Upcoming resets -->
                    <div class="glass rounded-xl p-5">
                        <h3 class="text-xs font-bold text-white mb-3 flex items-center">
                            <i class="ph ph-clock-countdown mr-2 text-indigo-400"></i> Upcoming Resets
                        </h3>
                        <div id="upcoming-resets" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
                    </div>

                    <!-- Alerts -->
                    <div class="glass rounded-xl p-5">
                        <h3 class="text-xs font-bold text-white mb-3 flex items-center">
                            <i class="ph ph-bell-ringing mr-2 text-rose-400"></i> System Alerts
                        </h3>
                        <div id="alerts-container"></div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script>
    // ─────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────
    let allData = [];
    let providers = [];       // seeded from /api/providers before first data fetch
    let activeProvider = null;
    let openAccounts = new Set();
    let autoOpenedProviders = new Set();

    const detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kuala_Lumpur';
    let userTimezone = detectedTz;

    // Refresh interval: ms value, or 0 = manual
    const INTERVALS = [
        { label: '10s',   ms: 10_000 },
        { label: '30s',   ms: 30_000 },
        { label: '60s',   ms: 60_000 },
        { label: '5m',    ms: 300_000 },
        { label: '1h',    ms: 3_600_000 },
        { label: 'Manual',ms: 0 },
    ];
    let refreshMs = 60_000;
    let timerId = null;

    // ─────────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────────
    async function init() {
        buildIntervalButtons();
        initTimezones();
        setInterval(updateClock, 1000);
        updateClock();
        // Pre-seed the sidebar from the backend's PROVIDERS config so it never
        // shows "undefined" while waiting for the first live-data response.
        try {
            const pvRes = await fetch('/api/providers');
            if (pvRes.ok) {
                const pvData = await pvRes.json();
                if (Array.isArray(pvData) && pvData.length > 0) {
                    providers = pvData;
                    activeProvider = providers[0];
                    buildProviderNav();
                }
            }
        } catch (_) {}
        await fetchAll();
        startPolling();
    }

    // ─────────────────────────────────────────────
    // Refresh interval controls
    // ─────────────────────────────────────────────
    function buildIntervalButtons() {
        const el = document.getElementById('interval-btns');
        el.innerHTML = INTERVALS.map(({ label, ms }) => `
            <button class="interval-btn px-2 py-0.5 rounded text-[10px] font-bold font-mono border border-transparent text-slate-500 ${ms === refreshMs ? 'active' : ''}"
                onclick="setInterval2(${ms})">${label}</button>
        `).join('');
    }

    function setInterval2(ms) {
        refreshMs = ms;
        buildIntervalButtons();
        startPolling();
    }

    function startPolling() {
        if (timerId) clearInterval(timerId);
        if (refreshMs > 0) {
            timerId = setInterval(fetchAll, refreshMs);
        }
    }

    async function manualSync() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('animate-spin');
        await fetchAll();
        setTimeout(() => icon.classList.remove('animate-spin'), 600);
    }

    // ─────────────────────────────────────────────
    // Timezone + clock
    // ─────────────────────────────────────────────
    function initTimezones() {
        const select = document.getElementById('timezone-select');
        const common = ['Asia/Kuala_Lumpur','UTC','America/New_York','Europe/London','Asia/Tokyo','Australia/Sydney','America/Los_Angeles'];
        if (!common.includes(detectedTz)) common.unshift(detectedTz);
        select.innerHTML = common.map(tz => {
            let label = tz;
            if (tz === 'Asia/Kuala_Lumpur') label = 'UTC+8 (KL)';
            else if (tz === detectedTz && tz !== 'Asia/Kuala_Lumpur') label = tz + ' (Local)';
            return `<option value="${tz}" ${tz === userTimezone ? 'selected' : ''}>${label}</option>`;
        }).join('');
        select.addEventListener('change', e => { userTimezone = e.target.value; updateClock(); renderAll(); });
    }

    function updateClock() {
        try {
            const opts = { timeZone: userTimezone, year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: true };
            document.getElementById('clock').innerText = new Intl.DateTimeFormat('en-US', opts).format(new Date());
        } catch(_) {
            document.getElementById('clock').innerText = new Date().toLocaleString();
        }
    }

    // ─────────────────────────────────────────────
    // Data fetching
    // ─────────────────────────────────────────────
    async function fetchAll() {
        try {
            const [dataRes, histRes] = await Promise.all([
                fetch('/api/data'),
                fetch('/api/history'),
            ]);
            allData = await dataRes.json();
            if (!Array.isArray(allData)) allData = [];

            // Derive provider list — filter out any null/undefined values defensively
            const seen = new Set(allData.map(a => a.provider).filter(p => p != null));
            const liveProviders = [...seen].sort();

            // Merge: keep configured providers order, add any unexpected ones at end
            const merged = [...providers];
            for (const p of liveProviders) {
                if (!merged.includes(p)) merged.push(p);
            }
            if (merged.length > 0) providers = merged;
            if (providers.length === 0) providers = ['Antigravity']; // last-resort fallback

            // Ensure activeProvider is always a valid string
            if (!activeProvider || !providers.includes(activeProvider)) {
                activeProvider = providers[0];
            }

            buildProviderNav();

            if (histRes.ok) {
                const hist = await histRes.json();
                if (hist && hist.length > 1) {
                    trendChart.data.labels = hist.map(d => {
                        const date = new Date(d.timestamp + 'Z');
                        return new Intl.DateTimeFormat('en-US', { timeZone: userTimezone, hour:'numeric', minute:'2-digit' }).format(date);
                    });
                    trendChart.data.datasets[0].data = hist.map(d => d.capacity_used);
                    trendChart.update();
                }
            }

            document.getElementById('sidebar-last-refresh').innerText =
                'Last: ' + new Intl.DateTimeFormat('en-US', { timeZone: userTimezone, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: true }).format(new Date());

            // Sync Add Profile button visibility with current provider
            const launchBtn = document.getElementById('launch-btn');
            const noLaunchProviders = ['Codex', 'Gemini'];
            if (launchBtn) launchBtn.style.display = noLaunchProviders.includes(activeProvider) ? 'none' : 'flex';

            renderAll();
        } catch(e) {
            console.error('Fetch failed', e);
        }
    }

    // ─────────────────────────────────────────────
    // Provider sidebar
    // ─────────────────────────────────────────────
    function buildProviderNav() {
        const nav = document.getElementById('provider-nav');
        const ICONS = { Antigravity: 'ph-atom', Codex: 'ph-code', Gemini: 'ph-google-logo', Unknown: 'ph-question' };

        nav.innerHTML = providers.map(p => {
            const count = allData.filter(a => a.provider === p).length;
            const icon = ICONS[p] || 'ph-circle';
            const isActive = p === activeProvider;
            return `
            <button class="provider-tab w-full flex items-center justify-between px-3 py-2 rounded-lg text-left text-xs font-semibold text-slate-400 ${isActive ? 'active' : ''}"
                onclick="selectProvider('${p}')">
                <span class="flex items-center space-x-2">
                    <i class="ph ${icon} text-base"></i>
                    <span>${p}</span>
                </span>
                <span class="text-[10px] font-mono bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${count}</span>
            </button>`;
        }).join('');
    }

    function selectProvider(p) {
        activeProvider = p;
        buildProviderNav();
        renderAll();
        // Show/hide Add Profile button depending on provider
        const btn = document.getElementById('launch-btn');
        const noLaunchProviders = ['Codex', 'Gemini'];
        if (btn) btn.style.display = noLaunchProviders.includes(p) ? 'none' : 'flex';
    }

    // ─────────────────────────────────────────────
    // Launch profile
    // ─────────────────────────────────────────────
    async function launchProfile() {
        await fetch(`/api/launch?provider=${encodeURIComponent(activeProvider || 'Antigravity')}`, { method: 'POST' });
        setTimeout(fetchAll, 1200);
    }

    async function terminateSession(pid) {
        if (!confirm(`Are you sure you want to terminate session with PID ${pid}?`)) return;
        try {
            const res = await fetch(`/api/terminate?pid=${pid}`, { method: 'POST' });
            if (res.ok) {
                setTimeout(fetchAll, 600);
            } else {
                const err = await res.json();
                alert(`Failed to terminate: ${err.message || 'Unknown error'}`);
            }
        } catch (e) {
            alert(`Error: ${e.message}`);
        }
    }

    async function removeProfile(email, provider) {
        if (!confirm(`Remove profile for ${email} (${provider}) from cache?`)) return;
        try {
            const res = await fetch(`/api/remove_profile?email=${encodeURIComponent(email)}&provider=${encodeURIComponent(provider)}`, { method: 'POST' });
            if (res.ok) {
                setTimeout(fetchAll, 300);
            } else {
                const err = await res.json();
                alert(`Failed to remove: ${err.message || 'Unknown error'}`);
            }
        } catch (e) {
            alert(`Error: ${e.message}`);
        }
    }

    // ─────────────────────────────────────────────
    // Expand / collapse accounts
    // ─────────────────────────────────────────────
    function toggleAccount(id) {
        if (openAccounts.has(id)) openAccounts.delete(id);
        else openAccounts.add(id);
        renderAll();
    }

    // ─────────────────────────────────────────────
    // Helpers
    // ─────────────────────────────────────────────
    function formatResetTime(isoStr) {
        if (!isoStr || isoStr === 'N/A' || isoStr === '') return 'N/A';
        try {
            const opts = { timeZone: userTimezone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: true };
            return new Intl.DateTimeFormat('en-CA', opts).format(new Date(isoStr)).replace(',', '');
        } catch(_) { return isoStr; }
    }

    function modelIcon(name) {
        const n = name.toLowerCase();
        if (n.includes('claude')) return 'ph-brain';
        if (n.includes('gemini')) return 'ph-sparkle';
        if (n.includes('gpt')) return 'ph-lightning';
        if (n.includes('o1') || n.includes('o3') || n.includes('o4')) return 'ph-circle-dashed';
        if (n.includes('codex')) return 'ph-code';
        return 'ph-robot';
    }

    // ─────────────────────────────────────────────
    // Rendering
    // ─────────────────────────────────────────────
    function renderAll() {
        const filtered = allData.filter(a => a.provider === activeProvider);

        // Header breadcrumb
        document.getElementById('header-title').innerText = `${activeProvider || 'Dashboard'} — Quota Monitor`;
        document.getElementById('header-sub').innerText =
            filtered.length
                ? `${filtered.length} active session${filtered.length !== 1 ? 's' : ''} detected`
                : 'No active sessions detected for this provider';

        renderKPIs(filtered);
        renderAccounts(filtered);
        renderResets(filtered);
        renderAlerts(filtered);
    }

    function renderKPIs(data) {
        let totalModels = 0, exhausted = 0, capacitySum = 0;
        data.forEach(acc => {
            capacitySum += acc.avg_used;
            (acc.models || []).forEach(m => {
                totalModels++;
                if (m.used_pct_raw >= 100) exhausted++;
            });
        });
        const avgCap = data.length ? Math.round(capacitySum / data.length) : 0;
        const capColor = avgCap > 80 ? 'text-rose-500' : (avgCap > 50 ? 'text-amber-500' : 'text-emerald-500');

        document.getElementById('kpi-cards').innerHTML = `
        <div class="glass rounded-xl p-5 flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition transform group-hover:scale-110">
                <i class="ph ph-users text-6xl text-blue-400"></i>
            </div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-400 mb-2 flex items-center">
                <i class="ph ph-users mr-2"></i> Active Sessions
            </p>
            <h3 class="text-4xl font-bold text-white tracking-tight">${data.length}</h3>
        </div>
        <div class="glass rounded-xl p-5 flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition transform group-hover:scale-110">
                <i class="ph ph-cube text-6xl text-emerald-400"></i>
            </div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 mb-2 flex items-center">
                <i class="ph ph-cube mr-2"></i> Monitored Models
            </p>
            <h3 class="text-4xl font-bold text-white tracking-tight">${totalModels}</h3>
        </div>
        <div class="glass rounded-xl p-5 flex flex-col justify-between relative overflow-hidden group ${exhausted > 0 ? 'border border-rose-500/40 shadow-[0_0_15px_rgba(244,63,94,0.12)]' : ''}">
            <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition transform group-hover:scale-110">
                <i class="ph ph-warning-circle text-6xl text-rose-400"></i>
            </div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-rose-400 mb-2 flex items-center">
                <i class="ph ph-warning-circle mr-2"></i> Exhausted Quotas
            </p>
            <h3 class="text-4xl font-bold text-white tracking-tight">${exhausted}</h3>
        </div>
        <div class="glass rounded-xl p-5 flex justify-between items-center">
            <div>
                <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-400 mb-2 flex items-center">
                    <i class="ph ph-gauge mr-2"></i> Avg Capacity Used
                </p>
                <h3 class="text-4xl font-bold text-white tracking-tight">${avgCap}%</h3>
            </div>
            <div class="relative w-20 h-20">
                <svg class="w-full h-full transform -rotate-90 drop-shadow-[0_0_6px_currentColor] ${capColor}" viewBox="0 0 36 36">
                    <path class="text-slate-800" stroke-width="4" stroke="currentColor" fill="transparent"
                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path stroke-width="4" stroke-dasharray="${avgCap}, 100" stroke-linecap="round" stroke="currentColor" fill="transparent"
                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                </svg>
            </div>
        </div>`;
    }

    function renderAccounts(data) {
        const container = document.getElementById('accounts-container');

        // ── Codex: special log-based panel ──────────────────
        if (activeProvider === 'Codex') {
            const cx = data.find(a => a.codex_stats);
            if (!cx) {
                container.innerHTML = `
                <div class="glass rounded-xl p-10 text-center border border-dashed border-slate-700">
                    <i class="ph ph-file-search text-4xl text-slate-600 block mb-3"></i>
                    <h4 class="text-sm font-bold text-slate-400">No Codex Sessions Found</h4>
                    <p class="text-xs text-slate-500 max-w-sm mx-auto mt-2">
                        No <code class="text-emerald-400">~/.codex/sessions</code> logs detected. Open Codex Desktop
                        and make a request to generate log files.
                    </p>
                </div>`;
                return;
            }
            const s = cx.codex_stats;
            const usedColor = s.used_percent > 80 ? 'text-rose-400' : (s.used_percent > 50 ? 'text-amber-400' : 'text-emerald-400');
            const barColor  = s.used_percent > 80 ? 'bg-rose-500'   : (s.used_percent > 50 ? 'bg-amber-500'   : 'bg-emerald-500');
            container.innerHTML = `
            <!-- ⚠ Limitation Banner -->
            <div class="flex items-start space-x-3 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-xl px-4 py-3 text-xs">
                <i class="ph ph-warning text-lg shrink-0 mt-0.5"></i>
                <div>
                    <span class="font-bold">Data reflects last known request only.</span>
                    Stats are parsed from local <code class="text-amber-200">~/.codex/sessions</code> log files and
                    update only when Codex Desktop makes a new API call. If idle, figures may be stale.
                    Multi-account isolation is not supported by Codex Desktop — only the currently active account is shown.
                </div>
            </div>

            <!-- Rate Limit Summary -->
            <div class="glass rounded-xl overflow-hidden shadow-lg">
                <div class="px-5 py-3.5 border-b border-border/50 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="ph ph-code text-emerald-400 text-lg"></i>
                        <span class="font-bold text-sm text-white">Codex (Active Account)</span>
                        <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded
                            bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            ${s.plan_type} Plan
                        </span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-mono text-xs ${usedColor} font-bold">${s.used_percent.toFixed(1)}% used</span>
                        <div class="w-24 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div class="${barColor} h-full bar-glow" style="width:${Math.min(s.used_percent,100)}%"></div>
                        </div>
                    </div>
                </div>

                <!-- Rate Window -->
                <div class="grid grid-cols-3 gap-0 divide-x divide-border/50 border-b border-border/50" style="background:rgba(0,0,0,0.25)">
                    <div class="px-5 py-4">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Rate Window</p>
                        <p class="text-xl font-bold text-white">${s.window_label}</p>
                    </div>
                    <div class="px-5 py-4">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Resets In</p>
                        <p class="text-xl font-bold text-indigo-400 flex items-center space-x-1">
                            <i class="ph ph-clock-countdown text-base"></i>
                            <span>${s.reset_countdown}</span>
                        </p>
                        <p class="text-[10px] text-slate-600 mt-0.5">${s.reset_at_local}</p>
                    </div>
                    <div class="px-5 py-4">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Credits</p>
                        <p class="text-xl font-bold ${s.credits !== null ? 'text-yellow-400' : 'text-slate-600'}">${s.credits !== null ? s.credits : 'N/A'}</p>
                    </div>
                </div>

                <!-- Sessions & Prompts -->
                <div class="grid grid-cols-3 gap-0 divide-x divide-border/50 border-b border-border/50" style="background:rgba(0,0,0,0.2)">
                    <div class="px-5 py-4">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Total Sessions</p>
                        <p class="text-xl font-bold text-white">${s.total_sessions}</p>
                    </div>
                    <div class="px-5 py-4">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Total Prompts</p>
                        <p class="text-xl font-bold text-white">${s.total_prompts}</p>
                    </div>
                    <div class="px-5 py-4">
                        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Context Window</p>
                        <p class="text-xl font-bold text-slate-300">${s.context_window >= 1000 ? (s.context_window/1000).toFixed(0)+'K' : s.context_window}</p>
                    </div>
                </div>

                <!-- Token Breakdown Table -->
                <table class="w-full text-left" style="background:rgba(0,0,0,0.25)">
                    <thead class="text-[10px] font-mono font-bold uppercase tracking-wider text-slate-500 bg-black/20">
                        <tr>
                            <th class="px-5 py-2.5">Metric</th>
                            <th class="px-5 py-2.5 text-right">Last Request</th>
                            <th class="px-5 py-2.5 text-right">Latest Session</th>
                            <th class="px-5 py-2.5 text-right">All-Time (Logs)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${[
                            {label:'Input Tokens',     key:'input_tokens',     icon:'ph-arrow-down-right'},
                            {label:'Output Tokens',    key:'output_tokens',    icon:'ph-arrow-up-right'},
                            {label:'Cached Tokens',    key:'cached_tokens',    icon:'ph-lightning'},
                            {label:'Reasoning Tokens', key:'reasoning_tokens', icon:'ph-brain'},
                            {label:'Total Tokens',     key:'total_tokens',     icon:'ph-sigma'},
                        ].map(row => `
                        <tr class="border-t border-border/50 text-sm hover:bg-white/5 transition">
                            <td class="px-5 py-3 font-medium flex items-center space-x-2 text-slate-300">
                                <i class="ph ${row.icon} text-indigo-400 text-sm"></i>
                                <span>${row.label}</span>
                            </td>
                            <td class="px-5 py-3 text-right font-mono text-slate-300 text-xs">${s.last_request[row.key] ?? '—'}</td>
                            <td class="px-5 py-3 text-right font-mono text-emerald-400 text-xs font-semibold">${s.this_session[row.key] ?? '—'}</td>
                            <td class="px-5 py-3 text-right font-mono text-indigo-400 text-xs">${row.key !== 'total_tokens' ? (s.all_sessions[row.key] ?? '—') : '—'}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>

                <!-- Last Updated -->
                <div class="px-5 py-2.5 flex items-center justify-end space-x-1.5 border-t border-border/50" style="background:rgba(0,0,0,0.3)">
                    <i class="ph ph-clock text-slate-600 text-xs"></i>
                    <span class="text-[10px] text-slate-600">Last log update: <span class="text-slate-500 font-mono">${s.last_updated}</span></span>
                </div>
            </div>`;
            return;
        }
        // ── End Codex panel ─────────────────────────────────

        if (!data.length) {
            container.innerHTML = `
            <div class="glass rounded-xl p-12 text-center border border-dashed border-slate-700">
                <i class="ph ph-planet text-4xl text-slate-600 block mb-3"></i>
                <h4 class="text-sm font-bold text-slate-400">No Active Sessions</h4>
                <p class="text-xs text-slate-600 max-w-xs mx-auto mt-1 mb-4">
                    Launch a new profile to start monitoring, or wait for an existing IDE window to appear.
                </p>
                <button onclick="launchProfile()"
                    class="inline-flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition">
                    <i class="ph ph-plus-circle"></i><span>Add Profile</span>
                </button>
            </div>`;
            return;
        }

        // Auto-open first account if we haven't done so yet for this provider
        const firstId = data[0] ? (data[0].email.replace(/[^a-zA-Z0-9]/g, '_') + '_' + (data[0].pid || 'offline')) : null;
        if (firstId && !autoOpenedProviders.has(activeProvider)) {
            openAccounts.add(firstId);
            autoOpenedProviders.add(activeProvider);
        }

        container.innerHTML = data.map(acc => {
            const id = acc.email.replace(/[^a-zA-Z0-9]/g, '_') + '_' + (acc.pid || 'offline');
            const isOpen = openAccounts.has(id);
            const barColor = acc.avg_used > 80 ? 'bg-rose-500' : (acc.avg_used > 50 ? 'bg-amber-500' : 'bg-emerald-500');

            let rowsHtml;
            if (!acc.models || acc.models.length === 0) {
                rowsHtml = `
                <tr><td colspan="6" class="px-5 py-8 text-center text-slate-500 text-xs">
                    <i class="ph ph-hourglass text-lg block mb-1"></i>
                    Awaiting model data — complete sign-in inside the IDE window.
                </td></tr>`;
            } else {
                rowsHtml = acc.models.map(m => `
                <tr class="border-t border-border/50 text-sm hover:bg-white/5 transition">
                    <td class="px-5 py-3 font-medium flex items-center space-x-2 text-slate-200">
                        <i class="ph ${modelIcon(m.name)} text-indigo-400 text-base shrink-0"></i>
                        <span class="truncate">${m.name}</span>
                    </td>
                    <td class="px-5 py-3">
                        <div class="flex items-center space-x-2">
                            <span class="font-mono text-slate-400 text-xs w-14 shrink-0">${m.usage}</span>
                            <div class="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                <div class="${m.used_pct_raw > 80 ? 'bg-rose-500 bar-glow' : (m.used_pct_raw > 50 ? 'bg-amber-500' : 'bg-emerald-500')} h-full"
                                    style="width:${Math.min(m.used_pct_raw,100)}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-5 py-3 font-mono ${m.style} text-xs">${m.pct}</td>
                    <td class="px-5 py-3 font-mono text-slate-500 text-xs">${m.exact_reset_iso ? formatResetTime(m.exact_reset_iso) : m.exact_reset}</td>
                    <td class="px-5 py-3 font-mono text-slate-400 text-xs">
                        <span class="flex items-center space-x-1"><i class="ph ph-timer"></i><span>${m.reset_left}</span></span>
                      </td>
                    <td class="px-5 py-3 text-right">
                        <span class="px-2 py-0.5 text-[9px] font-bold rounded uppercase tracking-wider ${m.status_style}">${m.status_label}</span>
                    </td>
                </tr>`).join('');
            }

            const isOffline = !acc.pid;

            return `
            <div class="glass rounded-xl overflow-hidden shadow-lg ${isOffline ? 'opacity-70 hover:opacity-100 transition-opacity duration-200' : ''}">
                <div class="px-5 py-3.5 flex justify-between items-center cursor-pointer select-none hover:bg-white/[0.03] transition"
                    onclick="toggleAccount('${id}')">
                    <div class="flex items-center space-x-3 min-w-0">
                        <i class="ph ph-caret-right text-slate-500 text-sm shrink-0 transition-transform ${isOpen ? 'rotate-90' : ''}"></i>
                        <div class="min-w-0">
                            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                <span class="font-bold text-sm text-white truncate">${acc.email}</span>
                                <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[9px] px-2 py-0.5 rounded font-bold uppercase tracking-wider shrink-0">${acc.plan}</span>
                                ${!isOffline ? `
                                <span class="flex items-center space-x-1 text-emerald-400 text-[9px] bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 shrink-0">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                                    <span>PID ${acc.pid}</span>
                                </span>
                                ` : `
                                <span class="flex items-center space-x-1 text-slate-400 text-[9px] bg-slate-800 px-2 py-0.5 rounded border border-slate-700 shrink-0">
                                    <span class="w-1.5 h-1.5 rounded-full bg-slate-500 shrink-0"></span>
                                    <span>Offline</span>
                                </span>
                                `}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4 shrink-0 ml-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-mono text-slate-500">${acc.avg_used}% used</span>
                            <div class="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                <div class="${barColor} h-full bar-glow" style="width:${acc.avg_used}%"></div>
                            </div>
                        </div>
                        ${!isOffline ? `
                        <button onclick="event.stopPropagation(); terminateSession(${acc.pid})" 
                            title="Cancel Session / Terminate Process"
                            class="p-1.5 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition">
                            <i class="ph ph-power text-sm"></i>
                        </button>
                        ` : `
                        <button onclick="event.stopPropagation(); removeProfile('${acc.email}', '${acc.provider}')" 
                            title="Remove Profile / Delete Cache"
                            class="p-1.5 rounded-lg hover:bg-slate-700/50 text-slate-400 hover:text-white transition">
                            <i class="ph ph-trash text-sm"></i>
                        </button>
                        `}
                    </div>
                </div>
                <div class="${isOpen ? '' : 'hidden'} border-t border-border/50" style="background:rgba(0,0,0,0.25);">
                    <table class="w-full text-left">
                        <thead class="text-[10px] font-mono font-bold uppercase tracking-wider text-slate-500 bg-black/20">
                            <tr>
                                <th class="px-5 py-2.5">Model</th>
                                <th class="px-5 py-2.5">Usage</th>
                                <th class="px-5 py-2.5">Remaining</th>
                                <th class="px-5 py-2.5">Reset Time</th>
                                <th class="px-5 py-2.5">Time Left</th>
                                <th class="px-5 py-2.5 text-right">Status</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                    ${acc.gemini_meta ? `
                    <div class="px-5 py-2.5 flex items-center justify-between border-t border-border/50" style="background:rgba(0,0,0,0.3)">
                        <div class="flex items-center space-x-3 text-[10px] text-slate-600">
                            <span class="flex items-center space-x-1"><i class="ph ph-folder text-blue-500/60"></i><span class="text-slate-500">${acc.gemini_meta.project_id}</span></span>
                            <span>${acc.gemini_meta.total_models} models</span>
                            ${acc.gemini_meta.overaged_models > 0 ? `<span class="text-rose-400 font-bold">${acc.gemini_meta.overaged_models} overaged</span>` : ''}
                        </div>
                        <span class="text-[10px] text-slate-600 font-mono">Cache: ${acc.gemini_meta.last_updated}</span>
                    </div>
                    ` : ''}
                </div>
            </div>`;
        }).join('');
    }

    function renderResets(data) {
        const allModels = [];
        data.forEach(acc => {
            (acc.models || []).forEach(m => {
                if (m.exact_reset_iso && m.exact_reset_iso !== 'N/A') {
                    allModels.push({ ...m, account: acc.email });
                }
            });
        });

        allModels.sort((a, b) => {
            const parse = s => { const r = s.match(/(?:(\d+)h)?\s*(?:(\d+)m)?/); if (!r) return 99999; return (parseInt(r[1]||0)*60 + parseInt(r[2]||0)); };
            return parse(a.reset_left) - parse(b.reset_left);
        });

        const el = document.getElementById('upcoming-resets');
        if (!allModels.length) {
            el.innerHTML = '<div class="text-slate-600 text-xs text-center py-4 bg-black/20 rounded-lg">No upcoming resets</div>';
            return;
        }
        el.innerHTML = allModels.slice(0, 6).map(m => `
        <div class="flex justify-between items-center p-2.5 rounded-lg bg-black/20 border border-white/5 hover:bg-black/40 transition">
            <div class="flex items-center space-x-2 min-w-0">
                <div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center shrink-0">
                    <i class="ph ${modelIcon(m.name)} text-indigo-400 text-sm"></i>
                </div>
                <div class="min-w-0 flex flex-col">
                    <span class="text-slate-300 text-xs font-medium truncate">${m.name}</span>
                    <span class="text-[10px] text-slate-500 truncate">${m.account}</span>
                </div>
            </div>
            <span class="text-indigo-400 font-mono text-[10px] bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded shrink-0 ml-2">in ${m.reset_left}</span>
        </div>`).join('');
    }

    function renderAlerts(data) {
        let exhausted = 0;
        data.forEach(acc => (acc.models || []).forEach(m => { if (m.used_pct_raw >= 100) exhausted++; }));
        const el = document.getElementById('alerts-container');

        if (exhausted > 0) {
            el.innerHTML = `
            <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-4 rounded-xl flex items-start space-x-3 shadow-[0_0_15px_rgba(244,63,94,0.1)]">
                <div class="bg-rose-500/20 p-2 rounded-lg shrink-0"><i class="ph ph-warning-octagon text-xl"></i></div>
                <div>
                    <p class="font-bold text-sm">Quota Exhausted</p>
                    <p class="text-rose-400/80 text-xs mt-0.5">${exhausted} model(s) have reached their usage limits.</p>
                </div>
            </div>`;
        } else if (data.length === 0) {
            el.innerHTML = `
            <div class="bg-slate-800/50 border border-slate-700 text-slate-500 p-4 rounded-xl flex items-start space-x-3">
                <div class="bg-slate-700/50 p-2 rounded-lg shrink-0"><i class="ph ph-info text-xl"></i></div>
                <div>
                    <p class="font-bold text-sm text-slate-400">No Sessions</p>
                    <p class="text-slate-600 text-xs mt-0.5">No active providers detected yet.</p>
                </div>
            </div>`;
        } else {
            el.innerHTML = `
            <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-4 rounded-xl flex items-start space-x-3">
                <div class="bg-emerald-500/20 p-2 rounded-lg shrink-0"><i class="ph ph-check-circle text-xl"></i></div>
                <div>
                    <p class="font-bold text-sm">System Normal</p>
                    <p class="text-emerald-400/80 text-xs mt-0.5">All models are within quota limits.</p>
                </div>
            </div>`;
        }
    }

    // ─────────────────────────────────────────────
    // Trend chart
    // ─────────────────────────────────────────────
    const ctx = document.getElementById('trendChart').getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, 'rgba(99,102,241,0.35)');
    gradient.addColorStop(1, 'rgba(99,102,241,0.0)');

    const trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Capacity Used %',
                data: [],
                borderColor: '#818cf8',
                backgroundColor: gradient,
                borderWidth: 2,
                tension: 0.4,
                fill: true,
                pointBackgroundColor: '#c7d2fe',
                pointBorderColor: '#4f46e5',
                pointBorderWidth: 2,
                pointRadius: 2.5,
                pointHoverRadius: 5,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(15,23,42,0.9)',
                    titleColor: '#cbd5e1',
                    bodyColor: '#fff',
                    borderColor: 'rgba(51,65,85,0.5)',
                    borderWidth: 1,
                    padding: 8,
                    displayColors: false,
                    callbacks: { label: c => c.parsed.y + '% Used' }
                }
            },
            scales: {
                y: {
                    beginAtZero: true, max: 100,
                    grid: { color: 'rgba(30,41,59,0.25)', drawBorder: false },
                    ticks: { color: '#64748b', stepSize: 25, callback: v => v + '%', font: { family: 'Inter', size: 10 } }
                },
                x: {
                    grid: { display: false, drawBorder: false },
                    ticks: { color: '#64748b', maxTicksLimit: 6, font: { family: 'Inter', size: 10 } }
                }
            },
            interaction: { intersect: false, mode: 'index' }
        }
    });

    // ─────────────────────────────────────────────
    // Boot
    // ─────────────────────────────────────────────
    init();
    </script>
</body>
</html>
